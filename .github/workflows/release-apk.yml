name: Build and Release APK

# 每次推送到 main 触发：构建 release APK，创建递增版本 tag，并发布到 GitHub Release。
# 版本号：第一次发布为 v1.0.0，之后每次 patch 递增 0.0.1（v1.0.0 → v1.0.1 → v1.0.2 → …）。
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 GitHub Secrets 解码 release keystore，并导出签名环境变量供 assembleRelease 使用。
      - name: Set up release signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEY_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Verify keystore written
        run: |
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "Keystore is empty/missing. Check KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -5

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Compute next version tag
        id: version
        run: |
          git fetch --tags --prune
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          else
            v=${latest#v}
            major=${v%%.*}
            rest=${v#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            : "${major:=0}" "${minor:=0}" "${patch:=0}"
            patch=$((patch + 1))
            echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' -type f | sort | head -n 1)
          if [ -z "$apk" ]; then
            echo "No APK found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          echo "Uploading APK: $apk"
          gh release create "${{ steps.version.outputs.tag }}" "$apk" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
